name: Main Workflow

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        ocaml-compiler:
          - "4.14"
          - "5"
        skip_test:
          - false

        include:
          - os: ubuntu-latest
            ocaml-compiler: "4.08"
            skip_test: true

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # setup-ocaml v3 caches the opam root itself
      - name: Use OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      # Optional dependencies, so that the Wayland backend is compiled too
      - run: opam install -y conf-libwayland conf-wayland-protocols
        if: runner.os == 'Linux'

      - run: opam install -y "js_of_ocaml>=3.6" "js_of_ocaml-compiler>=3.6"

      # System dependencies (depexts) are installed by opam itself
      - run: opam install -y . --deps-only --with-test

      - run: make build

      # Even offscreen canvases need a display connection on X11
      - name: Run test suite (Linux)
        if: matrix.skip_test != true && runner.os == 'Linux'
        run: |
          sudo apt-get install -yqq xvfb
          xvfb-run -a make test

      - name: Run test suite
        if: matrix.skip_test != true && runner.os != 'Linux'
        run: make test

      - name: build-doc
        if: github.ref == 'refs/heads/master' && matrix.ocaml-compiler == '4.14' && runner.os == 'Linux'
        run: |
             sudo apt-get install -yqq python3-sphinx python3-sphinx-rtd-theme
             opam install -y dune odoc
             make doc
             touch _build/docs/.nojekyll
             touch _build/docs/sphinx/.nojekyll
             touch _build/docs/doc/.nojekyll

      - name: deploy-doc
        uses: JamesIves/github-pages-deploy-action@v4
        if: github.ref == 'refs/heads/master' && matrix.ocaml-compiler == '4.14' && runner.os == 'Linux'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: _build/docs/
          clean: true
